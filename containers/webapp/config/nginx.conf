events {
    worker_connections 10000;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Define detailed log format for security research
    log_format detailed '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      '$request_time $connection';
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    # Enhanced logging for security experiments
    access_log /var/log/nginx/access.log main buffer=64k flush=5s;
    access_log /var/log/nginx/detailed.log detailed buffer=64k flush=5s;
    error_log /var/log/nginx/error.log;
    
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    
    # Critical timeout settings for slow HTTP attacks
    client_header_timeout 10m;
    client_body_timeout 10m;
    keepalive_timeout 10m;
    send_timeout 10m;
    
    # Lingering settings for slow attacks
    lingering_close always;
    lingering_time 10m;
    lingering_timeout 10m;
    
    # TCP settings to be more tolerant
    reset_timedout_connection off;
    
    # Connection limits
    keepalive_requests 10000;
    
    # Buffer sizes for handling partial requests
    client_header_buffer_size 16k;
    large_client_header_buffers 8 32k;
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    
    server {
        listen 80;
        server_name localhost;
        root /var/www/html;
        index index.php index.html;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass unix:/var/run/php/php7.4-fpm.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            
            # FastCGI timeouts for slow attacks
            fastcgi_read_timeout 10m;
            fastcgi_send_timeout 10m;
            fastcgi_connect_timeout 10m;
        }

        location ~ /\.ht {
            deny all;
        }
    }
} 