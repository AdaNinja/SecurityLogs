[general]
# SQLMap configuration for low-and-slow attacks
random_agent = True
batch = True
threads = 1
delay = 120
time_sec = 10
risk = 1
level = 1

[targets]
# Default target settings
default_url = http://victim-web
default_technique = BUST

[injection]
# Injection settings
technique = BUST
dbms = MySQL
os = Linux

[optimization]
# Performance optimization
threads = 1
time_sec = 10
retries = 2

[misc]
# Miscellaneous settings
verbose = 1
output_dir = /opt/output/sqlmap 