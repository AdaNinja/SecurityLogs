# Complexity Configuration Example
# This file demonstrates how to customize complexity parameters

# Example 1: Using preset with overrides
custom_basic:
  name: "Custom Basic Variant"
  description: "Basic variant with custom weights"
  complexity: "basic"
  detection_difficulty: "easy"
  
  # Custom complexity configuration
  complexity_config:
    preset: "basic"
    # Override specific parameters
    background_activity_weight: 0.45  # Increased from 0.4
    attack_stealth_weight: 0.25       # Decreased from 0.3
    noise_level_weight: 0.15          # Increased from 0.1
    max_score: 3.5                    # Increased from 3.0

# Example 2: Completely custom configuration
fully_custom:
  name: "Fully Custom Variant"
  description: "Variant with completely custom complexity weights"
  complexity: "custom"
  detection_difficulty: "medium"
  
  # Fully custom complexity configuration
  complexity_config:
    name: "Custom Difficulty"
    description: "Custom complexity configuration for specific testing needs"
    background_activity_weight: 0.4
    attack_stealth_weight: 0.35
    evasion_technique_weight: 0.2
    noise_level_weight: 0.05
    max_score: 4.5

# Example 3: Specialized configuration for stealth testing
stealth_focused:
  name: "Stealth-Focused Variant"
  description: "Variant optimized for stealth detection testing"
  complexity: "stealth"
  detection_difficulty: "hard"
  
  # Stealth-focused complexity configuration
  complexity_config:
    name: "Stealth Detection Focus"
    description: "Optimized for testing stealth detection capabilities"
    background_activity_weight: 0.2
    attack_stealth_weight: 0.5        # High weight on stealth
    evasion_technique_weight: 0.3     # High weight on evasion
    noise_level_weight: 0.0
    max_score: 5.0

# Example 4: Noise-focused configuration
noise_focused:
  name: "Noise-Focused Variant"
  description: "Variant with high background noise for testing"
  complexity: "noise"
  detection_difficulty: "medium"
  
  # Noise-focused complexity configuration
  complexity_config:
    name: "High Noise Environment"
    description: "Optimized for testing in high-noise environments"
    background_activity_weight: 0.5
    noise_level_weight: 0.3           # High weight on noise
    attack_stealth_weight: 0.15
    evasion_technique_weight: 0.05

# Example 5: Balanced configuration
balanced:
  name: "Balanced Variant"
  description: "Variant with balanced complexity weights"
  complexity: "balanced"
  detection_difficulty: "medium"
  
  # Balanced complexity configuration
  complexity_config:
    name: "Balanced Complexity"
    description: "Evenly distributed complexity weights"
    background_activity_weight: 0.35
    attack_stealth_weight: 0.35
    evasion_technique_weight: 0.25
    noise_level_weight: 0.05
    max_score: 4.0
