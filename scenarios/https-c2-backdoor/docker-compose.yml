version: '3.8'

services:
  # Backend API with malicious npm package
  backend-api:
    build:
      context: ../../containers/backend-api
      dockerfile: Dockerfile
    container_name: securitylogs-backend-api
    hostname: backend-api
    networks:
      - attacknet
    ports:
      - "3000:3000"
    volumes:
      # Log mounts
      - ../../logs/backend-api:/var/log
      - ../../logs/nodejs:/var/log/nodejs
      # Data mounts
      - ../../pcap_data/https-c2-backdoor:/data/raw
      - ../../output/backend-api:/opt/output
      # Script mounts
      - ../../containers/backend-api/scripts:/opt/scripts
      # App mounts
      - ../../containers/backend-api/src:/app/src
    environment:
      - SERVICE_NAME=securitylogs-backend-api
      - TARGET_HOST=backend-api
      - SCENARIO_TYPE=backend-api
      - NODE_ENV=production
      - API_PORT=3000
      - C2_SERVER_URL=https://attacker-c2:8443
    depends_on:
      - tcpdump-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Malicious C2 Server (disguised as legitimate API)
  attacker-c2:
    build:
      context: ../../containers/c2-server
      dockerfile: Dockerfile
    container_name: securitylogs-attacker-c2
    hostname: attacker-c2
    networks:
      - attacknet
    ports:
      - "8443:8443"
      - "8084:8080"
    volumes:
      # C2 data and logs
      - ../../output/attacker-c2:/opt/output
      - ../../logs/attacker-c2:/opt/logs
      - ../../pcap_data/https-c2-backdoor:/data/raw
      # Script mounts
      - ../../containers/c2-server/scripts:/opt/scripts
      # C2 server files
      - ../../containers/c2-server/c2_server:/opt/c2
    environment:
      - SERVICE_NAME=securitylogs-attacker-c2
      - C2_PROTOCOL=https
      - C2_PORT=8443
      - SCENARIO_TYPE=https-c2
      - SSL_CERT=/opt/c2/cert.pem
      - SSL_KEY=/opt/c2/key.pem
    restart: unless-stopped

  # Network Traffic Capture Container
  tcpdump-api:
    build:
      context: ../../containers/tcpdump
      dockerfile: Dockerfile
    container_name: securitylogs-tcpdump-api
    hostname: tcpdump-api
    networks:
      - attacknet
    volumes:
      # PCAP storage
      - ../../pcap_data/https-c2-backdoor:/pcaps
      - ../../logs/tcpdump-api:/logs
      # Script mounts
      - ../../containers/tcpdump/scripts:/usr/local/bin
    environment:
      - SERVICE_NAME=securitylogs-tcpdump-api
      - CAPTURE_INTERFACE=eth0
      - CAPTURE_FILTER=host backend-api or host attacker-c2
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    command: ["tcpdump", "-i", "eth0", "-w", "/pcaps/api_traffic.pcap", "-s", "65535"]

  # Client simulator (generates normal traffic)
  client-simulator:
    build:
      context: ../../containers/attacker
      dockerfile: Dockerfile
    container_name: securitylogs-client-simulator
    hostname: client-simulator
    networks:
      - attacknet
    volumes:
      # Script mounts
      - ../../containers/attacker/scripts:/opt/scripts
      - ../../output/client-simulator:/opt/output
      - ../../logs/client-simulator:/opt/logs
    environment:
      - SERVICE_NAME=securitylogs-client-simulator
      - TARGET_URL=https://backend-api:3000
      - REQUEST_RATE=50
      - SCENARIO_TYPE=client-simulator
    depends_on:
      backend-api:
        condition: service_healthy
    restart: unless-stopped
    command: ["python3", "/opt/scripts/simulate_client.py"]

# Custom network for attack simulation
networks:
  attacknet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
          gateway: 172.22.0.1
    driver_opts:
      com.docker.network.bridge.name: securitylogs_https_attacknet
    labels:
      - "securitylogs.network=attack"
      - "securitylogs.scenario=https-c2-backdoor"

# Volume definitions for persistent data
volumes:
  backend_api_logs:
    driver: local
  attacker_c2_data:
    driver: local
  client_simulator_data:
    driver: local
  pcap_data:
    driver: local 