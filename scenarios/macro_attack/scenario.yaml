# Macro Document Attack Scenario Configuration
name: "macro_document_attack"
description: "Macro document attack scenario with different complexity variants"

# Scenario variant configuration
variants:
  simple:
    name: "Simple Variant"
    description: "Basic macro document attack with minimal background activity"
    complexity: "basic"
    
    # Background activity configuration
    background_activities:
      - type: "office_work"
        intensity: "minimal"
        actions: ["open_document", "simple_editing"]
        duration: 30
      
      - type: "web_browsing"
        intensity: "minimal"
        actions: ["check_email", "visit_news"]
        duration: 20
    
    # Attack configuration
    attack:
      stealth_level: "low"
      delivery_method: "email_attachment"
      document_type: "word"
      macro_actions:
        - "basic_command_execution"
        - "file_creation"
      execution_delay: 0
      obfuscation_level: "none"
      # No evasion techniques for simple variant

  medium:
    name: "Medium Variant"
    description: "Macro document attack with moderate background activity and stealth"
    complexity: "intermediate"
    
    # Background activities
    background_activities:
      - type: "office_work"
        intensity: "moderate"
        actions: ["open_document", "edit_document", "save_document"]
        duration: 60
      
      - type: "collaboration"
        intensity: "moderate"
        actions: ["slack_chat", "email_composition"]
        duration: 45
      
      - type: "multimedia"
        intensity: "moderate"
        actions: ["watch_video", "listen_music"]
        duration: 30
    
    # Attack configuration
    attack:
      stealth_level: "medium"
      delivery_method: "phishing_email"
      document_type: "excel"
      macro_actions:
        - "encrypted_command_execution"
        - "registry_modification"
        - "network_connection"
      execution_delay: 5
      obfuscation_level: "basic"
      evasion_techniques:
        - "document_obfuscation"
        - "macro_encryption"
        - "social_engineering"

  complex:
    name: "Complex Variant"
    description: "Macro document attack with rich background activity and high stealth"
    complexity: "advanced"
    
    # Rich background activities
    background_activities:
      - type: "office_work"
        intensity: "high"
        actions: ["open_document", "edit_document", "save_document", "print_document"]
        duration: 90
      
      - type: "collaboration"
        intensity: "high"
        actions: ["slack_chat", "zoom_meeting", "email_composition", "file_sharing"]
        duration: 75
      
      - type: "multimedia"
        intensity: "high"
        actions: ["watch_video", "listen_music", "stream_content"]
        duration: 60
      
      - type: "development"
        intensity: "moderate"
        actions: ["edit_code", "run_tests", "git_operations"]
        duration: 45
      
      - type: "system_maintenance"
        intensity: "moderate"
        actions: ["system_update", "backup_creation", "disk_cleanup"]
        duration: 30
    
    # Attack configuration with evasion techniques
    attack:
      stealth_level: "high"
      delivery_method: "targeted_spear_phishing"
      document_type: "powerpoint"
      macro_actions:
        - "polymorphic_payload_execution"
        - "anti_vm_checks"
        - "sandbox_evasion"
        - "persistence_establishment"
        - "lateral_movement_preparation"
      execution_delay: 15
      obfuscation_level: "advanced"
      evasion_techniques:
        - "document_obfuscation"
        - "macro_encryption"
        - "social_engineering"
        - "polymorphic_code"
        - "anti_analysis"
        - "sandbox_evasion"

# Logging configuration
logging:
  office_logs: true
  system_logs: true
  network_logs: true
  process_logs: true
  file_access_logs: true
  user_activity_logs: true

# Data labeling configuration
labeling:
  attack_start_marker: "macro_document_begin"
  attack_end_marker: "macro_document_end"
  success_marker: "macro_execution_success"
  failure_marker: "macro_execution_failed"
  variant_marker: "variant_complexity_level"

# Detection quality metrics
detection_metrics:
  - "false_positive_rate"
  - "detection_time"
  - "alert_accuracy"
  - "investigation_complexity"
  - "noise_level" 