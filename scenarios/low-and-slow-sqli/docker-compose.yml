  #     - ../../data/proxy_logs:/var/log/proxy
  #     - ../../data/correlated_flows:/var/log/correlated
  #     - ../../scripts/proxy_config:/etc/correlator
  #   environment:
  #     - CORRELATION_CONFIG=/etc/correlator/flow-correlation.conf
  #     - LOG_LEVEL=INFO
  #     - VARIANT_ID=${VARIANT_ID:-moderate}
  #   depends_on:
  #     - dns-proxy
  #     - http-proxy
  #   restart: unless-stopped
  #   command: ["/usr/local/bin/flow-correlator", "--config", "/etc/correlator/flow-correlation.conf"]

# Custom network for attack simulation
networks:
  attacknet:
    driver: bridge

# Volume definitions for persistent data
volumes:
  webapp_logs:
    driver: local
  attacker_output:
    driver: local
  pcap_data:
    driver: local
  mysql_data:
    driver: local
  proxy_logs:
    driver: local
  correlated_flows:
    driver: local
