services:
  # Web Application Container (Target)
  webapp:
    image: securitylogs-webapp:latest
    dns:
      - 8.8.8.8
      - 8.8.4.4
    container_name: securitylogs-webapp
    hostname: victim-web
    networks:
      - attacknet
    # ports:  # Ports will be set by variant-specific override files
    volumes:
      # Script mounts (volume mounts will be overridden by variant-specific configs)
      - ../../containers/webapp/scripts:/opt/scripts
      - ./scripts:/opt/scripts
    environment:
      - SERVICE_NAME=securitylogs-webapp
      - TARGET_HOST=victim-web
      - TARGET_PORT=80
    depends_on:
      - tcpdump
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: ["/usr/local/bin/start.sh"]

  # Network Traffic Capture Container (Enhanced)
  tcpdump:
    image: securitylogs-tcpdump:minimal
    container_name: securitylogs-tcpdump
    hostname: tcpdump-sidecar
    networks:
      - attacknet
    volumes:
      # Script mounts (volume mounts will be overridden by variant-specific configs)
      - ../../containers/tcpdump/scripts:/usr/local/bin
    environment:
      - SERVICE_NAME=securitylogs-tcpdump
      - CAPTURE_INTERFACE=eth0
      - CAPTURE_FILTER=host victim-web
      # Dynamic PCAP filename configuration
      - SCENARIO_NAME=${SCENARIO_NAME:-low-and-slow-sqli}
      - VARIANT_ID=${VARIANT_ID:-moderate}
      - TIMESTAMP=${TIMESTAMP:-$(date +%Y%m%d_%H%M%S)}
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    privileged: true
    restart: unless-stopped
    # Enhanced tcpdump command with dynamic filename
    command: ["/bin/bash", "-c", "tcpdump -i any -w \"/pcaps/$${SCENARIO_NAME:-low-and-slow-sqli}_$${VARIANT_ID:-moderate}_$${TIMESTAMP:-$$(date +%Y%m%d_%H%M%S)}.pcap\" -s 262144 -v"]

  # Lightweight Attacker Container
  attacker:
    image: securitylogs-attacker:latest
    dns:
      - 8.8.8.8
      - 8.8.4.4
    container_name: securitylogs-attacker
    hostname: attacker
    networks:
      - attacknet
    volumes:
      # Script mounts (volume mounts will be overridden by variant-specific configs)
      - ../../scripts/attack:/opt/scripts/attack_modules
    environment:
      - SERVICE_NAME=securitylogs-attacker
      - TARGET_HOST=victim-web
      - TARGET_PORT=80
      - ATTACK_TYPE=sql_injection
      - ATTACK_PHASE=automated
    depends_on:
      - webapp
    restart: unless-stopped
    command: ["tail", "-f", "/dev/null"]

  # DNS Server for Real C&C Communication
  dns-server:
    image: securitylogs-dns-server:latest
    container_name: securitylogs-dns-server
    hostname: dns-server
    # Use internal network only, no host port mapping
    networks:
      - attacknet
    volumes:
      - ../../data/dns_logs:/var/log/dns-server
      - ../../containers/dns-server/attacker.local.zone:/etc/bind/zones/attacker.local.zone
    environment:
      - DNS_SERVER_CONFIG=/etc/bind/named.conf
      - LOG_LEVEL=INFO
      - VARIANT_ID=${VARIANT_ID:-moderate}
    restart: unless-stopped
    command: ["/usr/sbin/named", "-g", "-c", "/etc/bind/named.conf", "-u", "bind"]

  # DNS Proxy for Raw Unencrypted Flow Capture (Commented out - image not available)
  # dns-proxy:
  #   image: securitylogs-dns-proxy:latest
  #   container_name: securitylogs-dns-proxy
  #   hostname: dns-proxy
  #   # Use internal network only, no host port mapping
  #   networks:
  #     - attacknet
  #   volumes:
  #     - ../../data/proxy_logs:/var/log/dns-proxy
  #     - ../../scripts/proxy_config:/etc/dns-proxy
  #   environment:
  #     - DNS_PROXY_CONFIG=/etc/dns-proxy/dns-proxy.conf
  #     - LOG_LEVEL=INFO
  #     - VARIANT_ID=${VARIANT_ID:-moderate}
  #   restart: unless-stopped
  #   command: ["/usr/local/bin/dns-proxy", "--config", "/etc/dns-proxy/dns-proxy.conf"]

  # HTTP Proxy for Raw Unencrypted Flow Capture (Commented out - image not available)
  # http-proxy:
  #   image: securitylogs-http-proxy:latest
  #   container_name: securitylogs-http-proxy
  #   hostname: http-proxy
  #   # Use internal network only, no host port mapping
  #   networks:
  #     - attacknet
  #   volumes:
  #     - ../../data/proxy_logs:/var/log/http-proxy
  #     - ../../scripts/proxy_config:/etc/http-proxy
  #   environment:
  #     - HTTP_PROXY_CONFIG=/etc/http-proxy/http-proxy.conf
  #     - LOG_LEVEL=INFO
  #     - VARIANT_ID=${VARIANT_ID:-moderate}
  #   restart: unless-stopped
  #   command: ["/usr/local/bin/http-proxy", "--config", "/etc/http-proxy/http-proxy.conf"]

  # Flow Correlation Service (Commented out - image not available)
  # flow-correlator:
  #   image: securitylogs-flow-correlator:latest
  #   container_name: securitylogs-flow-correlator
  #   hostname: flow-correlator
  #   networks:
  #     - attacknet
