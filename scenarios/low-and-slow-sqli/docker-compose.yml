version: '3.8'

services:
  # Web Application Container (Target)
  webapp:
    image: securitylogs-webapp:latest
    dns:
      - 8.8.8.8
      - 8.8.4.4
    container_name: securitylogs-webapp
    hostname: victim-web
    networks:
      - attacknet
    # ports:  # Ports will be set by variant-specific override files
    volumes:
      # Script mounts (volume mounts will be overridden by variant-specific configs)
      - ../../containers/webapp/scripts:/opt/scripts
      - ./scripts:/opt/scripts
    environment:
      - SERVICE_NAME=securitylogs-webapp
      - TARGET_HOST=victim-web
      - TARGET_PORT=80
    depends_on:
      - tcpdump
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: ["/usr/local/bin/start.sh"]

  # Network Traffic Capture Container (Enhanced)
  tcpdump:
    image: securitylogs-tcpdump:minimal
    container_name: securitylogs-tcpdump
    hostname: tcpdump-sidecar
    networks:
      - attacknet
    volumes:
      # Script mounts (volume mounts will be overridden by variant-specific configs)
      - ../../containers/tcpdump/scripts:/usr/local/bin
    environment:
      - SERVICE_NAME=securitylogs-tcpdump
      - CAPTURE_INTERFACE=eth0
      - CAPTURE_FILTER=host victim-web
      # Dynamic PCAP filename configuration
      - SCENARIO_NAME=${SCENARIO_NAME:-low-and-slow-sqli}
      - VARIANT_ID=${VARIANT_ID:-moderate}
      - TIMESTAMP=${TIMESTAMP:-$(date +%Y%m%d_%H%M%S)}
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    privileged: true
    restart: unless-stopped
    # Enhanced tcpdump command with dynamic filename
    command: ["/bin/bash", "-c", "tcpdump -i any -w \"/pcaps/$${SCENARIO_NAME:-low-and-slow-sqli}_$${VARIANT_ID:-moderate}_$${TIMESTAMP:-$$(date +%Y%m%d_%H%M%S)}.pcap\" -s 262144 -v"]

  # Lightweight Attacker Container
  attacker:
    image: securitylogs-attacker:latest
    dns:
      - 8.8.8.8
      - 8.8.4.4
    container_name: securitylogs-attacker
    hostname: attacker
    networks:
      - attacknet
    volumes:
      # Script mounts (volume mounts will be overridden by variant-specific configs)
      - ../../scripts/attack:/opt/scripts/attack_modules
    environment:
      - SERVICE_NAME=securitylogs-attacker
      - TARGET_HOST=victim-web
      - TARGET_PORT=80
      - ATTACK_TYPE=sql_injection
      - ATTACK_PHASE=automated
    depends_on:
      - webapp
    restart: unless-stopped
    command: ["tail", "-f", "/dev/null"]

  # Log Aggregator Container (Enhanced)
  log-aggregator:
    image: ubuntu:20.04
    container_name: securitylogs-log-aggregator
    hostname: log-aggregator
    networks:
      - attacknet
    volumes:
      # Script mounts (volume mounts will be overridden by variant-specific configs)
      - ../../control:/opt/control
    environment:
      - SERVICE_NAME=securitylogs-log-aggregator
      - AGGREGATION_INTERVAL=60
      - LOG_RETENTION_DAYS=7
    restart: unless-stopped
    command: ["/bin/bash", "-c", "apt-get update && apt-get install -y python3 python3-pip curl && pip3 install requests && python3 /opt/control/multi_source_logger.py --continuous"]

# Custom network for attack simulation
networks:
  attacknet:
    driver: bridge

# Volume definitions for persistent data
volumes:
  webapp_logs:
    driver: local
  attacker_output:
    driver: local
  pcap_data:
    driver: local
  mysql_data:
    driver: local
