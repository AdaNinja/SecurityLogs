version: '3.8'
services:
  webapp:
    ports:
      - "8081:80"
    environment:
      - VARIANT_ID=lowscan_stealthy
      - EXPERIMENT_TIMESTAMP=20250724_023128
    volumes:
      # Variant-specific data collection structure (simplified)
      - ../../data/logs/lowscan_stealthy/web:/var/log/nginx
      - ../../data/logs/lowscan_stealthy/system:/var/log/system
      - ../../data/logs/lowscan_stealthy/attacks:/opt/output

  attacker:
    environment:
      - VARIANT_ID=lowscan_stealthy
      - EXPERIMENT_TIMESTAMP=20250724_023128
    volumes:
      # Variant-specific output and logs (simplified)
      - ../../data/logs/lowscan_stealthy/attacks:/opt/output
      - ../../data/logs/lowscan_stealthy/system:/opt/logs

  tcpdump:
    environment:
      - VARIANT_ID=lowscan_stealthy
      - EXPERIMENT_TIMESTAMP=20250724_023128
    volumes:
      # Variant-specific PCAP and logs (simplified)
      - ../../data/logs/lowscan_stealthy/pcap:/pcaps
      - ../../data/logs/lowscan_stealthy/system:/logs

networks:
  attacknet:
    name: "lowscan_stealthy_net"
