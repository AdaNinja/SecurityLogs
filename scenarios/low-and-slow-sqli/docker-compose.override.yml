version: '3.8'
services:
  webapp:
    ports:
      - "8081:80"
    environment:
      - VARIANT_ID=lowscan_aggressive
      - EXPERIMENT_TIMESTAMP=20250722_110326
    volumes:
      # Variant-specific data collection structure
      - ../../data/logs/lowscan_aggressive:/var/log
      - ../../data/logs/lowscan_aggressive/pcap:/data/raw
      - ../../data/logs/lowscan_aggressive/output:/opt/output

  attacker:
    environment:
      - VARIANT_ID=lowscan_aggressive
      - EXPERIMENT_TIMESTAMP=20250722_110326
    volumes:
      # Variant-specific output and logs
      - ../../data/logs/lowscan_aggressive/output:/opt/output
      - ../../data/logs/lowscan_aggressive/logs:/opt/logs

  tcpdump:
    environment:
      - VARIANT_ID=lowscan_aggressive
      - EXPERIMENT_TIMESTAMP=20250722_110326
    volumes:
      # Variant-specific PCAP and logs
      - ../../data/logs/lowscan_aggressive/pcap:/pcaps
      - ../../data/logs/lowscan_aggressive/logs:/logs

  log-aggregator:
    environment:
      - VARIANT_ID=lowscan_aggressive
      - EXPERIMENT_TIMESTAMP=20250722_110326
    volumes:
      # Variant-specific logs and output
      - ../../data/logs/lowscan_aggressive:/logs
      - ../../data/logs/lowscan_aggressive/output:/output

networks:
  attacknet:
    name: "lowscan_aggressive_net"
