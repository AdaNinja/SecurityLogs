# Redis Unauthorized Access Attack Scenario Configuration
name: "redis_unauthorized_access"
description: "Redis unauthorized access attack scenario with different complexity variants"

# Scenario variant configuration
variants:
  simple:
    name: "Simple Variant"
    description: "Basic Redis unauthorized access with minimal background activity"
    complexity: "basic"
    
    # Background activity configuration
    background_activities:
      - type: "web_browsing"
        intensity: "minimal"
      
      - type: "file_operations"
        intensity: "minimal"
    
    # Attack configuration
    attack:
      stealth_level: "low"
      # No evasion techniques for simple variant

  medium:
    name: "Medium Variant"
    description: "Redis unauthorized access with moderate background activity and stealth"
    complexity: "intermediate"
    
    # Background activities
    background_activities:
      - type: "development"
        intensity: "moderate"
      
      - type: "collaboration"
        intensity: "moderate"
      
      - type: "multimedia"
        intensity: "moderate"
    
    # Attack configuration
    attack:
      stealth_level: "medium"
      evasion_techniques:
        - "connection_pooling"
        - "request_throttling"

  complex:
    name: "Complex Variant"
    description: "Redis unauthorized access with rich background activity and high stealth"
    complexity: "advanced"
    
    # Rich background activities
    background_activities:
      - type: "development"
        intensity: "high"
      
      - type: "collaboration"
        intensity: "high"
      
      - type: "multimedia"
        intensity: "high"
      
      - type: "system_maintenance"
        intensity: "moderate"
      
      - type: "office_work"
        intensity: "moderate"
    
    # Attack configuration with evasion techniques
    attack:
      stealth_level: "high"
      evasion_techniques:
        - "connection_pooling"
        - "request_throttling"
        - "payload_obfuscation"
        - "timing_manipulation"
        - "protocol_manipulation"

# Logging configuration
logging:
  redis_logs: true
  system_logs: true
  network_logs: true
  process_logs: true
  file_access_logs: true
  user_activity_logs: true

# Data labeling configuration
labeling:
  attack_start_marker: "redis_unauthorized_begin"
  attack_end_marker: "redis_unauthorized_end"
  success_marker: "redis_access_success"
  failure_marker: "redis_access_failed"
  variant_marker: "variant_complexity_level"

# Detection quality metrics
detection_metrics:
  - "false_positive_rate"
  - "detection_time"
  - "alert_accuracy"
  - "investigation_complexity"
  - "noise_level"
  - "data_loss_assessment" 