# Machine Learning Training Dataset - Balanced Multi-Class Attack Dataset
# Generates balanced, high-quality training data for ML security models
# Designed for: AI/ML research, automated threat detection model training, academic research
# Features: Balanced classes, comprehensive labels, feature-rich data generation

scenario:
  name: "ml-training-balanced-test"
  description: "Balanced dataset for ML training with equal representation of all 7 attack types (fast test version)"
  duration: 420  # 7 minutes for testing (change to 0 for unlimited)
  random_seed: 2023
  attack_types: ["sql_injection", "xss", "directory_traversal", "command_injection", "authentication_bypass", "file_discovery", "http_method_enum"]
  waf_mode: "off"  # Pure attack data without WAF interference

# Perfectly balanced attack distribution (≈12.86% per attack type)
# Total attack traffic: 90%, Benign traffic: 10%
behaviors:
  attacks:
  # Class 1: SQL Injection (12.86% of total traffic)
  - name: ml_sql_injection_class
    node: attacker
    percentage: 12.86  # Every ~7.8 seconds
    payload_config:
      files:
      - /scripts/attacks/sql_inj.txt
      lines: "all"  # All 14 payloads repeated for sufficient samples
    script: /scripts/attack.sh
    script_args: ["--attack-type", "sql_injection", "--waf-mode", "off", "--interval", "2", "--max-payloads", "10"]
    
  # Class 2: Cross-Site Scripting (12.86% of total traffic)
  - name: ml_xss_class
    node: attacker
    percentage: 12.86  # Every ~7.8 seconds
    payload_config:
      files:
      - /scripts/attacks/xss.txt
      lines: "all"  # All 12 payloads repeated for sufficient samples
    script: /scripts/attack.sh
    script_args: ["--attack-type", "xss", "--waf-mode", "off", "--interval", "2", "--max-payloads", "8"]
    
  # Class 3: Directory Traversal (12.86% of total traffic)
  - name: ml_directory_traversal_class
    node: attacker
    percentage: 12.86  # Every ~7.8 seconds
    payload_config:
      files:
      - /scripts/attacks/directory_traversal.txt
      lines: "all"  # All 6 payloads repeated for sufficient samples
    script: /scripts/attack.sh
    script_args: ["--attack-type", "directory_traversal", "--waf-mode", "off", "--interval", "3", "--max-payloads", "6"]
    
  # Class 4: Command Injection (12.86% of total traffic)
  - name: ml_command_injection_class
    node: attacker
    percentage: 12.86  # Every ~7.8 seconds
    payload_config:
      files:
      - /scripts/attacks/command_inj.txt
      lines: "all"  # All 6 payloads repeated for sufficient samples
    script: /scripts/attack.sh
    script_args: ["--attack-type", "command_injection", "--waf-mode", "off", "--interval", "3", "--max-payloads", "6"]
    
  # Class 5: Authentication Bypass (12.86% of total traffic)
  - name: ml_authentication_bypass_class
    node: attacker
    percentage: 12.86  # Every ~7.8 seconds
    payload_config:
      files:
      - /scripts/attacks/auth_bypass.txt
      lines: "all"  # All 12 payloads repeated for sufficient samples
    script: /scripts/attack.sh
    script_args: ["--attack-type", "authentication_bypass", "--waf-mode", "off", "--interval", "2", "--max-payloads", "8"]
    
  # Class 6: File Discovery (12.86% of total traffic)
  - name: ml_file_discovery_class
    node: attacker
    percentage: 12.86  # Every ~7.8 seconds
    payload_config:
      files:
      - /scripts/attacks/file_discovery.txt
      lines: "all"  # All 12 payloads repeated for sufficient samples
    script: /scripts/attack.sh
    script_args: ["--attack-type", "file_discovery", "--waf-mode", "off", "--interval", "2", "--max-payloads", "8"]
    
  # Class 7: HTTP Method Enumeration (12.86% of total traffic)
  - name: ml_http_method_enum_class
    node: attacker
    percentage: 12.86  # Every ~7.8 seconds
    payload_config:
      files:
      - /scripts/attacks/method_enum.txt
      lines: "all"  # All 6 payloads repeated for sufficient samples
    script: /scripts/attack.sh
    script_args: ["--attack-type", "http_method_enum", "--waf-mode", "off", "--interval", "4", "--max-payloads", "6"]
    
  # Class 0: Benign Traffic (10% of total traffic for baseline/negative class)
  benign_traffic:
  - name: ml_benign_baseline_class
    node: benign_user
    percentage: 10  # 10% benign traffic - every 10 seconds
    script: /scripts/benign.sh
    script_args: ["--target", "http://fancystore.com", "--behavior", "browse", "--frequency", "normal"]

# Simplified infrastructure
infrastructure:
  networks:
  - name: internal-net
    driver: bridge
  - name: external-net
    driver: bridge
    
  nodes:
  - name: juice-shop
    role: target
    image: bkimminich/juice-shop
    networks: ['internal-net']
    ports: ['3000:3000']
    environment: ['NODE_ENV=production']
  
  - name: nginx
    role: proxy
    networks: ['internal-net', 'external-net']
    network_aliases:
      internal-net: ['fancystore.com']
      external-net: ['fancystore.com']
    ports: ['80:80']
    volumes:
    - ./scenario-securitylogs/confs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    - ./logs/nginx:/var/log/nginx
  
  - name: attacker
    role: attacker
    image: ras-attacker:latest
    networks: ['internal-net']
    environment:
    - TARGET_URL=http://fancystore.com
    - TARGET_HOST=fancystore.com
    - TARGET_PORT=80
    - ML_MODE=true
    - BALANCED_EXECUTION=true
    volumes:
    - ./scenario-securitylogs/confs/attacker:/scripts
    - ./logs/attacker:/logs
  
  - name: benign_user
    role: user
    image: python:3.9-slim
    command: tail -f /dev/null
    networks: ['internal-net']
    environment:
    - TARGET_URL=http://fancystore.com
    - USER_TYPE=ml_diverse
    volumes:
    - ./scenario-securitylogs/confs/user:/scripts
    - ./logs/benign_user:/logs

# Simplified data collection
data_collection:
  logs:
  - source: nginx
    path: /var/log/nginx/detailed.log
    output: ml_nginx_detailed.csv
    parser: nginx_parser
    real_time: true
  - source: attacker
    path: /logs/attack.log
    output: ml_attack_log.csv
    parser: attacker_parser
    real_time: true
  - source: benign_user
    path: /logs/user.log
    output: ml_user_behavior.csv
    parser: user_parser
    real_time: true
  network:
  - interface: any
    filter: net 172.27.0.0/16 or net 172.28.0.0/16
    output: ml_network_traffic.pcap
    capture_size: 500MB  # 500MB for 7-minute test

# Standard hooks
hooks:
  post_node_start:
  - name: verify_juice_shop
    script: ./hooks/verify_juice_shop.py
    timeout: 30
  post_collection:
  - name: auto_parse_logs
    script: ./hooks/auto_parse_logs.py
    timeout: 300
