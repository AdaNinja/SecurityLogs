behaviors:
  attacks:
  - duration: 60
    interval: 2
    name: sql_injector
    node: attacker
    payload_config:
      files:
      - /scripts/attack_scripts/attacks.txt
      lines:
      - 1
      - 10
      strategy: sequential
    script: /scripts/attack.sh
    trigger:
      type: immediate
      value: 0
  - duration: 60
    interval: 2
    name: xss_attack
    node: attacker
    payload_config:
      files:
      - /scripts/attack_scripts/attacks.txt
      lines:
      - 11
      - 20
      strategy: sequential
    script: /scripts/attack.sh
    trigger:
      type: delay
      value: 15
  benign_traffic:
  - duration: 300
    interval: 5
    name: normal_browsing
    node: benign_user
    script: /scripts/benign.sh
    script_args: ["--target", "http://nginx:80", "--duration", "5"]
    trigger:
      type: delay
      value: 10
  - duration: 300
    interval: 5
    name: login_and_shopping
    node: benign_user
    script: /scripts/benign.sh
    script_args: ["--target", "http://nginx:80", "--duration", "5"]
    trigger:
      type: delay
      value: 30
data_collection:
  logs:
  - output: nginx_detailed.csv
    parser: nginx_parser
    path: /var/log/nginx/detailed.log
    real_time: true
    source: nginx
  - output: attack_log.csv
    parser: attacker_parser
    path: /logs/attack.log
    real_time: true
    source: attacker
  - output: user_behavior.csv
    parser: user_parser
    path: /logs/user.log
    real_time: true
    source: benign_user
  network:
  - interface: any
    filter: net 172.27.0.0/16 or net 172.28.0.0/16
    output: network_traffic.pcap
    capture_size: 100MB
  system: []
hooks:
  post_collection:
  - context:
    - all_log_files
    - scenario_name
    name: hook_0
    script: ./hooks/setup_basic.sh
    timeout: 60
  post_node_start:
  - context:
    - nodes
    - health_check
    name: verify_0
    script: ./hooks/verify_juice_shop.py
    timeout: 30
infrastructure:
  networks:
  - driver: bridge
    gateway: 172.27.0.1
    name: internal-net
    subnet: 172.27.0.0/16
  - driver: bridge
    gateway: 172.28.0.1
    name: external-net
    subnet: 172.28.0.0/16
  nodes:
  - environment:
    - NODE_ENV=production
    image: bkimminich/juice-shop
    name: juice-shop
    networks:
    - internal-net
    - external-net
    ports:
    - 3000:3000
    role: target
    volumes: []
  - environment: []
    image: nginx:alpine
    name: nginx
    networks:
    - internal-net
    - external-net
    ports:
    - 80:80
    role: proxy
    volumes:
    - /home/jiayi/SecurityLogs/CyberRange/scenario-securitylogs/confs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    - /home/jiayi/SecurityLogs/CyberRange/logs/nginx:/var/log/nginx
  - environment:
    - TARGET_URL=http://nginx:80
    - TARGET_HOST=nginx
    - TARGET_PORT=80
    image: ras-attacker:latest
    name: attacker
    networks:
    - internal-net
    role: attacker
    volumes:
    - /home/jiayi/SecurityLogs/CyberRange/scenario-securitylogs/confs/attacker:/scripts
    - /home/jiayi/SecurityLogs/CyberRange/logs/attacker:/logs
  - command: tail -f /dev/null
    environment:
    - TARGET_URL=http://nginx:80
    - USER_TYPE=normal
    image: python:3.9-slim
    name: benign_user
    networks:
    - internal-net
    role: user
    volumes:
    - /home/jiayi/SecurityLogs/CyberRange/scenario-securitylogs/confs/user:/scripts
    - /home/jiayi/SecurityLogs/CyberRange/logs/benign_user:/logs
monitoring:
  alerts:
  - action: restart_container
    condition: container_down
    max_attempts: 3
  metrics:
  - alert_threshold: 0.8
    interval: 30
    name: container_health
  - alert_threshold: 0.5
    interval: 60
    name: attack_success_rate
output:
  base_dir: data/modular_demo
  compression: false
  formats:
  - csv
  - json
  retention:
    days: 7
    max_size: 5GB
scenario:
  description: 'Modular scenario: web-attack-demo1'
  duration: 60
  name: web-attack-demo1
  random_seed: 1234
  version: '1.0'
