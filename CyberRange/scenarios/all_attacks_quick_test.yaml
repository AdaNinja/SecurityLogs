# Quick test for ALL attack types - fast validation
scenario:
  name: "all-attacks-quick-test"
  description: "Quick test to validate all attack types work correctly"
  duration: 180  # 3 minutes - quick test
  random_seed: 12345
  attack_types: ["sql_injection", "xss", "directory_traversal", "command_injection", "authentication_bypass", "file_discovery", "http_method_enum"]
  waf_mode: "off"

# Equal distribution for quick testing
behaviors:
  attacks:
  - name: sql_test
    node: attacker
    percentage: 13  # ~13% each attack type
    script: /scripts/attack.sh
    
  - name: xss_test
    node: attacker
    percentage: 13
    script: /scripts/attack.sh
    
  - name: directory_traversal_test
    node: attacker
    percentage: 13
    script: /scripts/attack.sh
    
  - name: command_injection_test
    node: attacker
    percentage: 13
    script: /scripts/attack.sh
    
  - name: authentication_bypass_test
    node: attacker
    percentage: 13
    script: /scripts/attack.sh
    
  - name: file_discovery_test
    node: attacker
    percentage: 13
    script: /scripts/attack.sh
    
  - name: http_method_enum_test
    node: attacker
    percentage: 13
    script: /scripts/attack.sh
    
  benign_traffic:
  - name: benign_baseline
    node: benign_user
    percentage: 9  # Small amount of benign traffic for baseline
    script: /scripts/benign.sh
    script_args: ["--target", "http://fancystore.com", "--behavior", "browse"]

infrastructure:
  networks:
  - name: internal-net
    driver: bridge
  - name: external-net
    driver: bridge
    
  nodes:
  - name: juice-shop
    role: target
    image: bkimminich/juice-shop
    networks: ['internal-net']
    ports: ['3000:3000']
    environment: ['NODE_ENV=production']
  
  - name: nginx
    role: proxy
    networks: ['internal-net', 'external-net']
    network_aliases:
      internal-net: ['fancystore.com']
      external-net: ['fancystore.com']
    ports: ['80:80']
    volumes:
    - ./scenario-securitylogs/confs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    - ./logs/nginx:/var/log/nginx
  
  - name: attacker
    role: attacker
    image: ras-attacker:latest
    networks: ['internal-net']
    environment:
    - TARGET_URL=http://fancystore.com
    - TARGET_HOST=fancystore.com
    - TARGET_PORT=80
    volumes:
    - ./scenario-securitylogs/confs/attacker:/scripts
    - ./logs/attacker:/logs
  
  - name: benign_user
    role: user
    image: python:3.9-slim
    command: tail -f /dev/null
    networks: ['internal-net']
    environment:
    - TARGET_URL=http://fancystore.com
    - USER_TYPE=normal
    volumes:
    - ./scenario-securitylogs/confs/user:/scripts
    - ./logs/benign_user:/logs

data_collection:
  logs:
  - source: nginx
    path: /var/log/nginx/detailed.log
    output: nginx_detailed.csv
    parser: nginx_parser
    real_time: true
  - source: attacker
    path: /logs/attack.log
    output: attack_log.csv
    parser: attacker_parser
    real_time: true
  - source: benign_user
    path: /logs/user.log
    output: user_behavior.csv
    parser: user_parser
    real_time: true
  network:
  - interface: any
    filter: net 172.27.0.0/16 or net 172.28.0.0/16
    output: network_traffic.pcap
    capture_size: 200MB

hooks:
  post_node_start:
  - name: verify_juice_shop
    script: ./hooks/verify_juice_shop.py
    timeout: 30
  post_collection:
  - name: auto_parse_logs
    script: ./hooks/auto_parse_logs.py
    timeout: 300
