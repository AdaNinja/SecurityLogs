# Comprehensive Attack Test Configuration
# Executes ALL attack types with ALL payloads, 5% attack traffic, 95% benign traffic
# Automatically stops when all behaviors complete
# Based on successful quick test results
#
# IMPROVEMENTS from quick test:
# 1. Optimized traffic percentages based on payload counts and success rates
# 2. Added execution control parameters for better attack completion
# 3. Increased timeouts based on actual execution times
# 4. Enhanced network capture size for comprehensive analysis
# 5. Traffic distribution: Benign(95%) + SQL(1%) + XSS(1%) + DirTraversal(1%) + CmdInj(1%) + AuthBypass(0.5%) + FileDisc(0.3%) + MethodEnum(0.2%)

scenario:
  name: "comprehensive-attack-test"
  description: "Comprehensive test executing all attack types with all payloads, 5% attack traffic, 95% benign traffic (realistic simulation)"
  duration: 0  # 0 = unlimited time, will stop when all behaviors complete
  random_seed: 12345
  attack_types: ["sql_injection", "xss", "directory_traversal", "command_injection", "authentication_bypass", "file_discovery", "http_method_enum"]
  waf_mode: "off"  # Can be changed to "on" to test WAF protection
  
  # Execution control parameters based on successful quick test
  execution:
    max_concurrent_attacks: 8  # Based on successful quick test with 8 parallel threads
    attack_completion_timeout: 1800  # 30 minutes max for all attacks to complete
    payload_execution_interval: 2  # 2 seconds between payloads (based on quick test success)
    graceful_shutdown: true  # Ensure clean completion of all attacks

# Traffic configuration - 5% attack traffic, 95% benign traffic
# Based on successful quick test: each attack type will execute ALL available payloads
# Traffic percentages optimized for realistic network simulation
behaviors:
  attacks:
  - name: sql_injection_comprehensive
    node: attacker
    percentage: 1  # 1% of total traffic (12 payloads, high success rate)
    payload_config:
      files:
      - /scripts/attacks/sql_inj.txt
      lines: "all"  # Execute ALL lines in the file
    script: /scripts/attack.sh
    # script_args will be dynamically generated by modular_adapter.py based on scenario.waf_mode
    
  - name: xss_comprehensive
    node: attacker
    percentage: 1  # 1% of total traffic (12 payloads, high success rate)
    payload_config:
      files:
      - /scripts/attacks/xss.txt
      lines: "all"  # Execute ALL lines in the file
    script: /scripts/attack.sh
    # script_args will be dynamically generated by modular_adapter.py based on scenario.waf_mode
    
  - name: directory_traversal_comprehensive
    node: attacker
    percentage: 1  # 1% of total traffic (13 payloads, good success rate)
    payload_config:
      files:
      - /scripts/attacks/directory_traversal.txt
      lines: "all"  # Execute ALL lines in the file
    script: /scripts/attack.sh
    # script_args will be dynamically generated by modular_adapter.py based on scenario.waf_mode
    
  - name: command_injection_comprehensive
    node: attacker
    percentage: 1  # 1% of total traffic (14 payloads, good success rate)
    payload_config:
      files:
      - /scripts/attacks/command_inj.txt
      lines: "all"  # Execute ALL lines in the file
    script: /scripts/attack.sh
    # script_args will be dynamically generated by modular_adapter.py based on scenario.waf_mode
    
  - name: authentication_bypass_comprehensive
    node: attacker
    percentage: 0.5  # 0.5% of total traffic (13 payloads, good success rate)
    payload_config:
      files:
      - /scripts/attacks/auth_bypass.txt
      lines: "all"  # Execute ALL lines in the file
    script: /scripts/attack.sh
    # script_args will be dynamically generated by modular_adapter.py based on scenario.waf_mode
    
  - name: file_discovery_comprehensive
    node: attacker
    percentage: 0.3  # 0.3% of total traffic (24 payloads, high success rate)
    payload_config:
      files:
      - /scripts/attacks/file_discovery.txt
      lines: "all"  # Execute ALL lines in the file
    script: /scripts/attack.sh
    # script_args will be dynamically generated by modular_adapter.py based on scenario.waf_mode
    
  - name: http_method_enum_comprehensive
    node: attacker
    percentage: 0.2  # 0.2% of total traffic (7 payloads, nmap-based attacks)
    payload_config:
      files:
      - /scripts/attacks/method_enum.txt
      lines: "all"  # Execute ALL lines in the file
    script: /scripts/attack.sh
    # script_args will be dynamically generated by modular_adapter.py based on scenario.waf_mode
    
  benign_traffic:
  - name: realistic_benign_traffic
    node: benign_user
    percentage: 95  # 95% normal browsing (realistic network simulation)
    script: /scripts/benign.sh
    script_args: ["--target", "http://fancystore.com", "--behavior", "browse", "--intensity", "high"]

infrastructure:
  networks:
  - name: internal-net
    driver: bridge
  - name: external-net
    driver: bridge
    
  nodes:
  - name: juice-shop
    role: target
    image: bkimminich/juice-shop
    networks: ['internal-net']
    ports: ['3000:3000']
    environment: ['NODE_ENV=production']
  
  - name: nginx
    role: proxy
    # image and configuration will be adapted by modular_adapter.py based on waf_mode
    networks: ['internal-net', 'external-net']
    network_aliases:
      internal-net: ['fancystore.com']
      external-net: ['fancystore.com']
    ports: ['80:80']
    volumes:
    - ./scenario-securitylogs/confs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    - ./logs/nginx:/var/log/nginx
  
  - name: attacker
    role: attacker
    image: ras-attacker:latest
    networks: ['internal-net']
    environment:
    - TARGET_URL=http://fancystore.com
    - TARGET_HOST=fancystore.com
    - TARGET_PORT=80
    volumes:
    - ./scenario-securitylogs/confs/attacker:/scripts
    - ./logs/attacker:/logs
  
  - name: benign_user
    role: user
    image: python:3.9-slim
    command: tail -f /dev/null
    networks: ['internal-net']
    environment:
    - TARGET_URL=http://fancystore.com
    - USER_TYPE=normal
    volumes:
    - ./scenario-securitylogs/confs/user:/scripts
    - ./logs/benign_user:/logs

data_collection:
  logs:
  - source: nginx
    path: /var/log/nginx/detailed.log
    output: nginx_detailed.csv
    parser: nginx_parser
    real_time: true
  - source: attacker
    path: /logs/attack.log
    output: attack_log.csv
    parser: attacker_parser
    real_time: true
  - source: benign_user
    path: /logs/user.log
    output: user_behavior.csv
    parser: user_parser
    real_time: true
  network:
  - interface: any
    filter: net 172.27.0.0/16 or net 172.28.0.0/16
    output: network_traffic.pcap
    capture_size: 1000MB  # Increased for comprehensive attack testing with all payloads

hooks:
  post_node_start:
  - name: verify_juice_shop
    script: ./hooks/verify_juice_shop.py
    timeout: 60  # Increased based on quick test experience
  post_collection:
  - name: auto_parse_logs
    script: ./hooks/auto_parse_logs.py
    timeout: 900  # Increased timeout for comprehensive analysis (15 minutes)
