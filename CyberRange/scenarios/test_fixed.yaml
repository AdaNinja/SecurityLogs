# Test Fixed Configuration
# Tests that attacks run correctly with proper timing

scenario:
  name: "test-fixed"
  description: "Test fixed timing and attack execution"
  duration: 30  # Total experiment time: 30 seconds
  random_seed: 12345
  attack_types: ["sql_injection", "xss"]
  waf_mode: "off"

behaviors:
  attacks:
  - name: sql_test
    node: attacker
    duration: 15  # Run SQL attacks for 15 seconds
    payload_config:
      files:
      - /scripts/attacks/sql_inj.txt
      lines:
      - 1
      - 2  # Only 2 SQL attacks (lines 1-2) per round
    script: /scripts/attack.sh
    script_args: ["--attack-type", "sql_injection", "--waf-mode", "off"]
    
  - name: xss_test
    node: attacker
    duration: 15  # Run XSS attacks for 15 seconds
    payload_config:
      files:
      - /scripts/attacks/xss.txt
      lines:
      - 1
      - 2  # Only 2 XSS attacks (lines 1-2) per round
    script: /scripts/attack.sh
    script_args: ["--attack-type", "xss", "--waf-mode", "off"]
    
  benign_traffic:
  - name: simple_browsing
    node: benign_user
    script: /scripts/benign.sh
    script_args: ["--target", "http://fancystore.com", "--duration", "1"]
