# CyberRange Complex Multi-Target Attack Scenario
# 复杂多目标攻击场景

scenario:
  name: "complex_multi_target"
  description: "复杂多目标攻击场景"
  duration: 600  # 10分钟
  random_seed: 123
  version: "1.0"

infrastructure:
  networks:
    - name: "frontend_network"
      driver: "bridge"
      subnet: "172.22.0.0/16"
      gateway: "172.22.0.1"
    - name: "backend_network"
      driver: "bridge"
      subnet: "172.23.0.0/16"
      gateway: "172.23.0.1"
  
  nodes:
    - name: "web_app"
      role: "target"
      image: "bkimminich/juice-shop:latest"
      ports:
        - "3000:3000"
      networks: ["frontend_network", "backend_network"]
      volumes:
        - "./logs/web_app:/app/logs"
      environment:
        - NODE_ENV=production
      health_check:
        url: "http://localhost:3000"
        interval: 30
        timeout: 10
        retries: 3
      
    - name: "database"
      role: "target"
      image: "mysql:8.0"
      networks: ["backend_network"]
      volumes:
        - "./logs/database:/var/log/mysql"
        - "./data/mysql:/var/lib/mysql"
      environment:
        - MYSQL_ROOT_PASSWORD=secret
        - MYSQL_DATABASE=testdb
        - MYSQL_USER=testuser
        - MYSQL_PASSWORD=testpass
      health_check:
        command: ["mysqladmin", "ping", "-h", "localhost"]
        interval: 30
        timeout: 10
        retries: 3
      
    - name: "nginx_proxy"
      role: "proxy"
      image: "nginx:latest"
      ports:
        - "80:80"
      networks: ["frontend_network"]
      volumes:
        - "./scenario-securitylogs/confs/nginx/nginx.conf:/etc/nginx/nginx.conf"
        - "./logs/nginx:/var/log/nginx"
      depends_on:
        - "web_app"
      
    - name: "attacker_1"
      role: "attacker"
      image: "python:3.9-slim"
      networks: ["frontend_network"]
      volumes:
        - "./scenario-securitylogs/confs/attacker:/scripts"
        - "./logs/attacker_1:/logs"
      environment:
        - TARGET_URL=http://nginx_proxy
        - TARGET_HOST=nginx_proxy
        - TARGET_PORT=80
        - ATTACK_TYPE=web
      command: ["/bin/bash", "-c", "tail -f /dev/null"]
      
    - name: "attacker_2"
      role: "attacker"
      image: "python:3.9-slim"
      networks: ["backend_network"]
      volumes:
        - "./scenario-securitylogs/confs/attacker:/scripts"
        - "./logs/attacker_2:/logs"
      environment:
        - TARGET_HOST=database
        - TARGET_PORT=3306
        - ATTACK_TYPE=database
      command: ["/bin/bash", "-c", "tail -f /dev/null"]
      
    - name: "benign_user"
      role: "user"
      image: "python:3.9-slim"
      networks: ["frontend_network"]
      volumes:
        - "./scenario-securitylogs/confs/user:/scripts"
        - "./logs/benign_user:/logs"
      environment:
        - TARGET_URL=http://nginx_proxy
        - TARGET_HOST=nginx_proxy
        - TARGET_PORT=80
        - USER_TYPE=normal
      command: ["/bin/bash", "-c", "tail -f /dev/null"]

behaviors:
  attacks:
    - name: "web_attacks"
      node: "attacker_1"
      script: "/scripts/attack.sh"
      trigger:
        type: "delay"
        value: 15  # 15秒后开始
      payload_config:
        files: ["/scripts/attack_scripts/attacks.txt"]
        lines: [1, 30]  # 使用前30行载荷
        strategy: "random"
      interval: 2  # 每次攻击间隔2秒
      duration: 300  # 攻击持续5分钟
      
    - name: "database_attacks"
      node: "attacker_2"
      script: "/scripts/attack.sh"
      trigger:
        type: "delay"
        value: 30  # 30秒后开始
      payload_config:
        files: ["/scripts/attack_scripts/attacks.txt"]
        lines: [1, 20]
        strategy: "sequential"
      interval: 5  # 每次攻击间隔5秒
      duration: 240  # 攻击持续4分钟
      
  benign_traffic:
    - name: "normal_browsing"
      node: "benign_user"
      script: "/scripts/benign.sh"
      trigger:
        type: "immediate"
        value: 5
      duration: 600  # 持续整个场景
      interval: 3  # 每3秒一次操作

data_collection:
  logs:
    - source: "web_app"
      path: "/app/logs/application.log"
      parser: "application_parser"
      output: "web_app_logs.csv"
      real_time: true
      
    - source: "nginx_proxy"
      path: "/var/log/nginx/access.log"
      parser: "nginx_parser"
      output: "nginx_access.csv"
      real_time: true
      
    - source: "nginx_proxy"
      path: "/var/log/nginx/error.log"
      parser: "nginx_parser"
      output: "nginx_error.csv"
      real_time: true
      
    - source: "database"
      path: "/var/log/mysql/error.log"
      parser: "mysql_parser"
      output: "mysql_logs.csv"
      real_time: true
      
    - source: "attacker_1"
      path: "/logs/attack.log"
      parser: "attacker_parser"
      output: "web_attack_log.csv"
      real_time: true
      
    - source: "attacker_2"
      path: "/logs/attack.log"
      parser: "attacker_parser"
      output: "db_attack_log.csv"
      real_time: true
      
    - source: "benign_user"
      path: "/logs/user.log"
      parser: "user_parser"
      output: "benign_user_log.csv"
      real_time: true
      
  network:
    - interface: "any"
      filter: "host 172.22.0.0/16 or host 172.23.0.0/16"
      output: "network_traffic.pcap"
      parser: "pcap_parser"
      parsed_output: "network_traffic.csv"
      capture_size: "100MB"
      
  system:
    - source: "host"
      path: "/var/log/audit/audit.log"
      parser: "auditd_parser"
      output: "audit_log.csv"
      real_time: true

hooks:
  pre_scenario:
    - name: "setup_complex_environment"
      script: "hooks/setup_complex.sh"
      context: ["scenario_name", "duration", "networks"]
      timeout: 60
      
  post_node_start:
    - name: "verify_services"
      script: "hooks/verify_services.py"
      context: ["node_info", "health_check"]
      timeout: 30
      
  post_attack:
    - name: "attack_analysis"
      script: "hooks/attack_analysis.py"
      context: ["attack_info", "target_response"]
      timeout: 60
      
  post_collection:
    - name: "data_validation"
      script: "hooks/validate_data.py"
      context: ["all_log_files", "scenario_name"]
      timeout: 60
      
    - name: "gt_labeling"
      script: "hooks/gt_labeling.py"
      context: ["all_log_files", "scenario_name", "output_dir"]
      timeout: 120
      
  post_scenario:
    - name: "generate_comprehensive_report"
      script: "hooks/generate_report.py"
      context: ["scenario_summary", "log_files", "output_dir"]
      timeout: 180
      
    - name: "cleanup_complex"
      script: "hooks/cleanup_complex.sh"
      context: ["scenario_name", "containers", "networks", "volumes"]
      timeout: 60

output:
  base_dir: "data/complex_scenario"
  scenario_dir: "{scenario_name}_{timestamp}"
  formats: ["csv", "json", "pcap"]
  compression: true
  retention:
    days: 30
    max_size: "10GB"
  
  reports:
    - type: "summary"
      format: "html"
      template: "templates/summary_report.html"
    - type: "detailed"
      format: "json"
      include_logs: true
    - type: "gt_labels"
      format: "csv"
      include_confidence: true

monitoring:
  metrics:
    - name: "container_health"
      interval: 30
      alert_threshold: 0.8
    - name: "attack_success_rate"
      interval: 60
      alert_threshold: 0.3
    - name: "log_collection_rate"
      interval: 30
      alert_threshold: 0.9
    - name: "network_traffic_rate"
      interval: 60
      alert_threshold: 0.5
      
  alerts:
    - condition: "container_down"
      action: "restart_container"
      max_retries: 3
    - condition: "log_collection_failed"
      action: "retry_collection"
      max_retries: 5
    - condition: "attack_failed"
      action: "log_warning"
      max_retries: 1
    - condition: "high_cpu_usage"
      action: "scale_down"
      threshold: 80 