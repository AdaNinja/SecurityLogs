# Production Environment Simulation - Realistic Attack Distribution
# Simulates real-world production environment with realistic attack/benign traffic ratios
# Based on industry cybersecurity reports showing typical attack patterns
# Designed for: Security team training, SOC validation, baseline security testing

scenario:
  name: "production-simulation-test"
  description: "Production environment simulation with realistic 97% benign / 3% attack traffic (fast test version)"
  duration: 300  # 5 minutes for testing (change to 3600 for full hour)
  random_seed: 24
  attack_types: ["sql_injection", "xss", "authentication_bypass", "command_injection", "directory_traversal", "file_discovery", "http_method_enum"]
  waf_mode: "off"  # Can be changed to "on" to test WAF effectiveness

# Realistic attack distribution based on OWASP Top 10 and CVE frequency
behaviors:
  attacks:
  # Tier 1: High-frequency, high-impact attacks (SQL Injection)
  - name: sql_injection_production
    node: attacker
    percentage: 1.0  # 1% of total traffic - every 100 seconds
    payload_config:
      files:
      - /scripts/attacks/sql_inj.txt
      lines: "all"  # All 14 payloads for comprehensive testing
    script: /scripts/attack.sh
    script_args: ["--attack-type", "sql_injection", "--waf-mode", "off", "--interval", "10", "--max-payloads", "5"]
    
  # Tier 2: Medium-high frequency attacks (XSS, Auth Bypass)
  - name: xss_production
    node: attacker
    percentage: 0.5  # 0.5% - every 200 seconds
    payload_config:
      files:
      - /scripts/attacks/xss.txt
      lines: "all"  # All 12 payloads
    script: /scripts/attack.sh
    script_args: ["--attack-type", "xss", "--waf-mode", "off", "--interval", "8", "--max-payloads", "4"]
    
  - name: authentication_bypass_production
    node: attacker
    percentage: 0.5  # 0.5% - every 200 seconds
    payload_config:
      files:
      - /scripts/attacks/auth_bypass.txt
      lines: "all"  # All 12 payloads
    script: /scripts/attack.sh
    script_args: ["--attack-type", "authentication_bypass", "--waf-mode", "off", "--interval", "15", "--max-payloads", "3"]
    
  # Tier 3: Targeted, high-impact attacks (Command Injection)
  - name: command_injection_production
    node: attacker
    percentage: 0.3  # 0.3% - rare but devastating
    payload_config:
      files:
      - /scripts/attacks/command_inj.txt
      lines: "all"  # All 6 payloads
    script: /scripts/attack.sh
    script_args: ["--attack-type", "command_injection", "--waf-mode", "off", "--interval", "20", "--max-payloads", "2"]
    
  - name: directory_traversal_production
    node: attacker
    percentage: 0.3  # 0.3% - file system attacks
    payload_config:
      files:
      - /scripts/attacks/directory_traversal.txt
      lines: "all"  # All 6 payloads
    script: /scripts/attack.sh
    script_args: ["--attack-type", "directory_traversal", "--waf-mode", "off", "--interval", "12", "--max-payloads", "3"]
    
  # Tier 4: Reconnaissance and information gathering
  - name: file_discovery_production
    node: attacker
    percentage: 0.2  # 0.2% - reconnaissance phase
    payload_config:
      files:
      - /scripts/attacks/file_discovery.txt
      lines: "all"  # All 12 payloads
    script: /scripts/attack.sh
    script_args: ["--attack-type", "file_discovery", "--waf-mode", "off", "--interval", "10", "--max-payloads", "4"]
    
  - name: http_method_enum_production
    node: attacker
    percentage: 0.2  # 0.2% - initial reconnaissance
    payload_config:
      files:
      - /scripts/attacks/method_enum.txt
      lines: "all"  # All 6 payloads
    script: /scripts/attack.sh
    script_args: ["--attack-type", "http_method_enum", "--waf-mode", "off", "--interval", "5", "--max-payloads", "6"]
    
  # Realistic benign traffic (97% - typical production environment)
  benign_traffic:
  - name: production_business_traffic
    node: benign_user
    percentage: 97  # 97% normal business operations - every ~1 second
    script: /scripts/benign.sh
    script_args: ["--target", "http://fancystore.com", "--behavior", "browse", "--frequency", "normal"]

# Production-grade infrastructure (simplified)
infrastructure:
  networks:
  - name: internal-net
    driver: bridge
  - name: external-net
    driver: bridge
    
  nodes:
  - name: juice-shop
    role: target
    image: bkimminich/juice-shop
    networks: ['internal-net']
    ports: ['3000:3000']
    environment: ['NODE_ENV=production']
  
  - name: nginx
    role: proxy
    networks: ['internal-net', 'external-net']
    network_aliases:
      internal-net: ['fancystore.com']
      external-net: ['fancystore.com']
    ports: ['80:80']
    volumes:
    - ./scenario-securitylogs/confs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    - ./logs/nginx:/var/log/nginx
  
  - name: attacker
    role: attacker
    image: ras-attacker:latest
    networks: ['internal-net']
    environment:
    - TARGET_URL=http://fancystore.com
    - TARGET_HOST=fancystore.com
    - TARGET_PORT=80
    - ATTACK_MODE=production_simulation
    volumes:
    - ./scenario-securitylogs/confs/attacker:/scripts
    - ./logs/attacker:/logs
  
  - name: benign_user
    role: user
    image: python:3.9-slim
    command: tail -f /dev/null
    networks: ['internal-net']
    environment:
    - TARGET_URL=http://fancystore.com
    - USER_TYPE=production_customer
    volumes:
    - ./scenario-securitylogs/confs/user:/scripts
    - ./logs/benign_user:/logs

# Simplified data collection
data_collection:
  logs:
  - source: nginx
    path: /var/log/nginx/detailed.log
    output: production_nginx_detailed.csv
    parser: nginx_parser
    real_time: true
  - source: attacker
    path: /logs/attack.log
    output: production_attack_log.csv
    parser: attacker_parser
    real_time: true
  - source: benign_user
    path: /logs/user.log
    output: production_user_behavior.csv
    parser: user_parser
    real_time: true
  network:
  - interface: any
    filter: net 172.27.0.0/16 or net 172.28.0.0/16
    output: production_network_traffic.pcap
    capture_size: 300MB  # 300MB for 5-minute test

# Standard hooks
hooks:
  post_node_start:
  - name: verify_juice_shop
    script: ./hooks/verify_juice_shop.py
    timeout: 30
  post_collection:
  - name: auto_parse_logs
    script: ./hooks/auto_parse_logs.py
    timeout: 300
