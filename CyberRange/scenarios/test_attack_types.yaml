# Test configuration to verify attack type mapping
# Tests authentication_bypass and command_injection specifically

scenario:
  name: "test-attack-types"
  description: "Test attack type mapping for authentication_bypass and command_injection"
  duration: 120  # 2 minutes for quick test
  random_seed: 12345
  attack_types: ["authentication_bypass", "command_injection", "sql_injection"]
  waf_mode: "off"

behaviors:
  attacks:
  - name: authentication_bypass_test
    node: attacker
    percentage: 40  # 40% of total traffic
    script: /scripts/attack.sh
    # script_args will be dynamically generated
    
  - name: command_injection_test
    node: attacker
    percentage: 40  # 40% of total traffic
    script: /scripts/attack.sh
    # script_args will be dynamically generated
    
  - name: sql_injection_test
    node: attacker
    percentage: 10  # 10% of total traffic
    script: /scripts/attack.sh
    # script_args will be dynamically generated
    
  benign_traffic:
  - name: minimal_benign_traffic
    node: benign_user
    percentage: 10  # 10% normal browsing
    script: /scripts/benign.sh
    script_args: ["--target", "http://fancystore.com", "--behavior", "browse"]

infrastructure:
  networks:
  - name: internal-net
    driver: bridge
  - name: external-net
    driver: bridge
    
  nodes:
  - name: juice-shop
    role: target
    image: bkimminich/juice-shop
    networks: ['internal-net']
    ports: ['3000:3000']
    environment: ['NODE_ENV=production']
  
  - name: nginx
    role: proxy
    networks: ['internal-net', 'external-net']
    network_aliases:
      internal-net: ['fancystore.com']
      external-net: ['fancystore.com']
    ports: ['80:80']
    volumes:
    - ./scenario-securitylogs/confs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    - ./logs/nginx:/var/log/nginx
  
  - name: attacker
    role: attacker
    image: ras-attacker:latest
    networks: ['internal-net']
    environment:
    - TARGET_URL=http://fancystore.com
    - TARGET_HOST=fancystore.com
    - TARGET_PORT=80
    volumes:
    - ./scenario-securitylogs/confs/attacker:/scripts
    - ./logs/attacker:/logs
  
  - name: benign_user
    role: user
    image: python:3.9-slim
    command: tail -f /dev/null
    networks: ['internal-net']
    environment:
    - TARGET_URL=http://fancystore.com
    - USER_TYPE=normal
    volumes:
    - ./scenario-securitylogs/confs/user:/scripts
    - ./logs/benign_user:/logs

data_collection:
  logs:
  - source: nginx
    path: /var/log/nginx/detailed.log
    output: nginx_detailed.csv
    parser: nginx_parser
    real_time: true
  - source: attacker
    path: /logs/attack.log
    output: attack_log.csv
    parser: attacker_parser
    real_time: true
  - source: benign_user
    path: /logs/user.log
    output: user_behavior.csv
    parser: user_parser
    real_time: true
  network:
  - interface: any
    filter: net 172.27.0.0/16 or net 172.28.0.0/16
    output: network_traffic.pcap
    capture_size: 100MB

hooks:
  post_node_start:
  - name: verify_juice_shop
    script: ./hooks/verify_juice_shop.py
    timeout: 30
  post_collection:
  - name: auto_parse_logs
    script: ./hooks/auto_parse_logs.py
    timeout: 300
