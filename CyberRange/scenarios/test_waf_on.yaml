# Test configuration for WAF enabled mode
# Verifies dynamic WAF configuration reading

scenario:
  name: "test-waf-on"
  description: "Test scenario with WAF enabled"
  duration: 60  # 60 seconds for quick test
  random_seed: 12345
  attack_types: ["sql_injection", "xss"]
  waf_mode: "on"  # Enable WAF

# Traffic ratio configuration - parallel execution mode
behaviors:
  attacks:
  - name: sql_attacks
    node: attacker
    percentage: 20  # 20% of total traffic
    payload_config:
      files:
      - /scripts/attacks/sql_inj.txt
      lines:
      - 1
      - 3
    script: /scripts/attack.sh
    # script_args will be dynamically generated with --waf-mode "on"
    
  - name: xss_attacks
    node: attacker
    percentage: 20  # 20% of total traffic
    payload_config:
      files:
      - /scripts/attacks/xss.txt
      lines:
      - 1
      - 3
    script: /scripts/attack.sh
    # script_args will be dynamically generated with --waf-mode "on"
    
  benign_traffic:
  - name: normal_browsing
    node: benign_user
    percentage: 60  # 60% normal browsing
    script: /scripts/benign.sh
    script_args: ["--target", "http://fancystore.com", "--behavior", "browse"]

infrastructure:
  networks:
  - name: internal-net
    driver: bridge
  - name: external-net
    driver: bridge
    
  nodes:
  - name: juice-shop
    role: target
    image: bkimminich/juice-shop
    networks: ['internal-net']
    ports: ['3000:3000']
    environment: ['NODE_ENV=production']
  
  - name: nginx
    role: proxy
    # image and configuration will be adapted by modular_adapter.py based on waf_mode
    networks: ['internal-net', 'external-net']
    network_aliases:
      internal-net: ['fancystore.com']
      external-net: ['fancystore.com']
    ports: ['80:80']
    volumes:
    - ./scenario-securitylogs/confs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    - ./logs/nginx:/var/log/nginx
  
  - name: attacker
    role: attacker
    image: ras-attacker:latest
    networks: ['internal-net']
    environment:
    - TARGET_URL=http://fancystore.com
    - TARGET_HOST=fancystore.com
    - TARGET_PORT=80
    volumes:
    - ./scenario-securitylogs/confs/attacker:/scripts
    - ./logs/attacker:/logs
  
  - name: benign_user
    role: user
    image: python:3.9-slim
    command: tail -f /dev/null
    networks: ['internal-net']
    environment:
    - TARGET_URL=http://fancystore.com
    - USER_TYPE=normal
    volumes:
    - ./scenario-securitylogs/confs/user:/scripts
    - ./logs/benign_user:/logs

data_collection:
  logs:
  - source: nginx
    path: /var/log/nginx/detailed.log
    output: nginx_detailed.csv
    parser: nginx_parser
    real_time: true
  - source: attacker
    path: /logs/attack.log
    output: attack_log.csv
    parser: attacker_parser
    real_time: true
  - source: benign_user
    path: /logs/user.log
    output: user_behavior.csv
    parser: user_parser
    real_time: true
  network:
  - interface: any
    filter: net 172.27.0.0/16 or net 172.28.0.0/16
    output: network_traffic.pcap
    capture_size: 100MB

hooks:
  post_node_start:
  - name: verify_juice_shop
    script: ./hooks/verify_juice_shop.py
    timeout: 30
  post_collection:
  - name: auto_parse_logs
    script: ./hooks/auto_parse_logs.py
    timeout: 300
