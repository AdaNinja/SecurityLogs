# WAF OFF Demo Configuration
# Tests normal attacks that should be blocked by WAF

scenario:
  name: "waf-off-demo"
  description: "WAF OFF mode - normal attacks that should be blocked by WAF"
  duration: 60
  random_seed: 12345
  attack_types: ["sql_injection", "xss"]
  waf_mode: "off"  # WAF is OFF - execute normal attacks

behaviors:
  attacks:
  - name: sql_injector
    node: attacker
    duration: 20
    interval: 1
    payload_config:
      files:
      - /scripts/attacks/sql_inj.txt
      lines:
      - 1
      - 3
    script: /scripts/attack.sh
    script_args: ["--attack-type", "sql_injection", "--waf-mode", "off"]
    
  - name: xss_attack
    node: attacker
    duration: 20
    interval: 1
    payload_config:
      files:
      - /scripts/attacks/xss.txt
      lines:
      - 1
      - 3
    script: /scripts/attack.sh
    script_args: ["--attack-type", "xss", "--waf-mode", "off"]
    
  benign_traffic:
  - name: normal_browsing
    node: benign_user
    duration: 60
    interval: 2
    script: /scripts/benign.sh
    script_args: ["--target", "http://nginx:80", "--duration", "1"]
    
  - name: login_and_shopping
    node: benign_user
    duration: 60
    interval: 2
    script: /scripts/benign.sh
    script_args: ["--target", "http://nginx:80", "--duration", "1"]

data_collection:
  logs:
  - output: nginx_detailed.csv
    parser: nginx_parser
    path: /var/log/nginx/detailed.log
    real_time: true
    source: nginx
  - output: attack_log.csv
    parser: attacker_parser
    path: /logs/attack.log
    real_time: true
    source: attacker
  - output: user_behavior.csv
    parser: user_parser
    path: /logs/user.log
    real_time: true
    source: benign_user
  network:
  - interface: any
    filter: net 172.27.0.0/16 or net 172.28.0.0/16
    output: network_traffic.pcap
    capture_size: 100MB
  system: []

hooks:
  post_collection:
  - name: auto_parse_logs
    script: ./hooks/auto_parse_logs.py
    timeout: 300
  - name: setup_basic
    script: ./hooks/setup_basic.sh
    timeout: 60
  post_node_start:
  - name: verify_juice_shop
    script: ./hooks/verify_juice_shop.py
    timeout: 30

infrastructure:
  networks:
  - driver: bridge
    gateway: 172.27.0.1
    name: internal-net
    subnet: 172.27.0.0/16
  - driver: bridge
    gateway: 172.28.0.1
    name: external-net
    subnet: 172.28.0.0/16
  nodes:
  - environment:
    - NODE_ENV=production
    image: bkimminich/juice-shop
    name: juice-shop
    networks:
    - internal-net
    - external-net
    ports:
    - 3000:3000
    role: target
    volumes: []
  - environment: []
    image: nginx:alpine
    name: nginx
    networks:
    - internal-net
    - external-net
    ports:
    - 80:80
    role: proxy
    volumes:
    - /home/jiayi/SecurityLogs/CyberRange/scenario-securitylogs/confs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    - /home/jiayi/SecurityLogs/CyberRange/logs/nginx:/var/log/nginx
  - environment:
    - TARGET_URL=http://nginx:80
    - TARGET_HOST=nginx
    - TARGET_PORT=80
    image: ras-attacker:latest
    name: attacker
    networks:
    - internal-net
    role: attacker
    volumes:
    - /home/jiayi/SecurityLogs/CyberRange/scenario-securitylogs/confs/attacker:/scripts
    - /home/jiayi/SecurityLogs/CyberRange/logs/attacker:/logs
  - command: tail -f /dev/null
    environment:
    - TARGET_URL=http://nginx:80
    - USER_TYPE=normal
    image: python:3.9-slim
    name: benign_user
    networks:
    - internal-net
    role: user
    volumes:
    - /home/jiayi/SecurityLogs/CyberRange/scenario-securitylogs/confs/user:/scripts
    - /home/jiayi/SecurityLogs/CyberRange/logs/benign_user:/logs

monitoring:
  alerts:
  - action: restart_container
    condition: container_down
    max_attempts: 3
  metrics:
  - alert_threshold: 0.8
    interval: 30
    name: container_health
  - alert_threshold: 0.5
    interval: 60
    name: attack_success_rate

output:
  base_dir: data/waf_off_demo
  compression: false
  formats:
  - csv
  - json
  retention:
    days: 7
    max_size: 5GB 