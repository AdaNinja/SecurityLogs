# ModSecurity Configuration for CyberRange WAF
# Compatible with OWASP ModSecurity CRS container

# Basic ModSecurity Configuration
SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess On

# Request body handling
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyInMemoryLimit 131072
SecRequestBodyLimitAction Reject

# Response body handling  
SecResponseBodyLimit 524288
SecResponseBodyLimitAction ProcessPartial

# Temporary directory for file uploads
SecTmpDir /tmp/
SecDataDir /tmp/

# Audit logging
SecAuditEngine On
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABDEFHIJZ
SecAuditLogType Serial
SecAuditLog /var/log/modsecurity/audit.log
SecAuditLogFormat JSON

# Debug logging (can be disabled in production)
SecDebugLog /var/log/modsecurity/debug.log
SecDebugLogLevel 3

# Rule compatibility
SecComponentSignature "ModSecurity for CyberRange/1.0"

# Include default CRS configuration
Include /etc/modsecurity.d/owasp-crs/crs-setup.conf
Include /etc/modsecurity.d/owasp-crs/rules/*.conf

# Custom paranoia and anomaly settings
SecAction \
  "id:900000,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.paranoia_level=2,\
   setvar:tx.executing_paranoia_level=2,\
   setvar:tx.detection_paranoia_level=2"

SecAction \
  "id:900100,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.critical_anomaly_score=5,\
   setvar:tx.error_anomaly_score=4,\
   setvar:tx.warning_anomaly_score=3,\
   setvar:tx.notice_anomaly_score=2"

SecAction \
  "id:900110,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.inbound_anomaly_score_threshold=5,\
   setvar:tx.outbound_anomaly_score_threshold=4"
