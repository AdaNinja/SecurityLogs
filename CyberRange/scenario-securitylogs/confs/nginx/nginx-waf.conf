# Custom Server Configuration for ModSecurity WAF
# This file is included as /etc/nginx/conf.d/custom.conf

# Custom detailed log format to capture attack/benign headers
log_format detailed '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   '"$http_x_attack_id" "$http_x_payload_id" '
                   '"$http_x_timestamp" "$http_x_source_ip" '
                   '"$http_x_traffic_type" "$http_x_attack_type"';

# Override default server to use our custom configuration
server {
    listen 8080 default_server;
    server_name fancystore.com localhost;

    # Enable ModSecurity for this server
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsecurity.d/modsecurity.conf;

    # Custom detailed logging
    access_log /var/log/nginx/detailed.log detailed;
    access_log /var/log/nginx/access.log combined;

    # Enable logging of request body (for POST requests)
    client_body_in_file_only on;
    client_body_buffer_size 128k;
    client_max_body_size 100m;

    location / {
        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Forward to Juice Shop
        proxy_pass http://juice-shop:3000;
        proxy_redirect off;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
