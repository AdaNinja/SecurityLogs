version: '3.8'

services:
  nginx:
    image: nginx:alpine
    hostname: fancystore.com
    ports:
      - "80:80"
    networks:
      edge:
        aliases:
          - fancystore.com
      appnet: {}
    volumes:
      - ./confs/nginx/:/etc/nginx/
      - ./out/${MODE:-mixed}/nginx/:/var/log/nginx
    depends_on:
      - web
    profiles:
      - attack-only
      - benign-only
      - mixed
      - mixed-parallel

  web:
    image: bkimminich/juice-shop:latest
    networks: [appnet]
    expose:
      - "3000"        # only visible inside appnet
    profiles:
      - attack-only
      - benign-only
      - mixed
      - mixed-parallel

  attacker:
    build:
      context: ./confs/attacker
      dockerfile: Dockerfile
    image: ras-attacker:latest
    networks: [edge]
    environment:
      - TARGET_HOST=fancystore.com
      - TARGET_PORT=80
      - ATTACK_TYPE=comprehensive
      - ATTACK_PHASE=automated
      - WAF_MODE=${WAF_MODE:-disabled}
    volumes:
      - ./confs/attacker/attack.sh:/attack.sh:ro
      - ./confs/attacker/attack_scripts/:/opt/scripts/:ro
      - ./out/${MODE:-mixed}/attacker/:/log
    depends_on:
      - nginx
    profiles:
      - attack-only
      - mixed
      - mixed-parallel

  user:
    image: alpine:latest
    networks: [edge]
    environment:
      - TARGET_HOST=fancystore.com
      - TARGET_PORT=80
      - WAF_MODE=${WAF_MODE:-disabled}
    volumes:
      - ./confs/user/benign.sh:/benign.sh:ro
      - ./out/${MODE:-mixed}/user/:/log/user
    entrypoint: ["/bin/sh", "/benign.sh"]
    depends_on:
      - nginx
    profiles:
      - benign-only
      - mixed
      - mixed-parallel
    # Add resources for browser automation
    shm_size: '2gb'
    mem_limit: 2g

networks:
  edge:
    driver: bridge
    name: ras-vanilla-edge
  appnet:
    driver: bridge
    name: ras-vanilla-appnet
