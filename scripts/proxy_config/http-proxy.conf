{
  "http_proxy": {
    "enabled": true,
    "listen_address": "0.0.0.0",
    "listen_port": 8080,
    "upstream_proxy": null,
    "log_format": "jsonl",
    "log_file": "/var/log/http-proxy/http_proxy_raw.jsonl",
    "attack_detection": {
      "enabled": true,
      "sql_injection": {
        "enabled": true,
        "patterns": [
          "'.*OR.*1=1",
          "'.*UNION.*SELECT",
          "'.*AND.*SELECT",
          "admin'.*--",
          "'.*OR.*'x'='x",
          "'.*AND.*SLEEP",
          "'.*UPDATEXML"
        ],
        "thresholds": {
          "max_payload_length": 1000,
          "suspicious_keywords": 3
        }
      },
      "dns_followup": {
        "enabled": true,
        "detect_dns_queries_after_http": true,
        "correlation_window": 30
      }
    },
    "content_analysis": {
      "enabled": true,
      "extract_credentials": true,
      "extract_sensitive_data": true,
      "detect_data_exfiltration": true
    }
  }
} 