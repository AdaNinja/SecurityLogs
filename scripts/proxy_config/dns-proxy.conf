{
  "dns_proxy": {
    "enabled": true,
    "listen_address": "0.0.0.0",
    "listen_port": 53,
    "upstream_dns": ["8.8.8.8", "8.8.4.4"],
    "log_format": "jsonl",
    "log_file": "/var/log/dns-proxy/dns_proxy_raw.jsonl",
    "attack_detection": {
      "enabled": true,
      "patterns": {
        "dns_tunnel": [
          "[A-Za-z0-9+/]{20,}",
          "cmd\\.[a-zA-Z0-9]+",
          "exfil\\.[a-zA-Z0-9]+",
          "tunnel\\.[a-zA-Z0-9]+"
        ],
        "dns_amplification": [
          "ANY\\.",
          "TXT\\.",
          "MX\\.",
          "AAAA\\."
        ],
        "dns_reconnaissance": [
          "admin\\.",
          "api\\.",
          "db\\.",
          "internal\\.",
          "jenkins\\.",
          "gitlab\\.",
          "jira\\.",
          "confluence\\."
        ]
      }
    },
    "tunnel_detection": {
      "enabled": true,
      "techniques": [
        "base64_encoding",
        "hex_encoding",
        "custom_encoding",
        "compression"
      ],
      "thresholds": {
        "query_length": 63,
        "subdomain_count": 5,
        "response_size": 512
      }
    }
  }
} 