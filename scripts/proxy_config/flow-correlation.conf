{
  "flow_correlation": {
    "enabled": true,
    "correlation_window": 60,
    "attack_sequences": {
      "dns_reconnaissance_to_http": {
        "description": "DNS reconnaissance followed by HTTP attack",
        "sequence": [
          {"type": "dns", "stage": "reconnaissance"},
          {"type": "http", "stage": "exploitation"}
