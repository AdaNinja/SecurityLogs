version: '3.8'

services:
  nginx:
    image: nginx:alpine
    hostname: fancystore.com
    ports:
      - "80:80"
    networks:
      edge:
        aliases:
          - fancystore.com
      appnet: {}
    volumes:
      - ./confs/nginx/:/etc/nginx/
      - ./out/${MODE:-mixed}/nginx/:/var/log/nginx
    depends_on:
      - web
    profiles:
      - attack-only
      - benign-only
      - mixed

  web:
    image: bkimminich/juice-shop:latest
    networks: [appnet]
    expose:
      - "3000"        # only visible inside appnet
    profiles:
      - attack-only
      - benign-only
      - mixed

  attacker:
    image: kalilinux/kali-rolling:latest
    networks: [edge]
    environment:
      - TARGET_HOST=fancystore.com
      - TARGET_PORT=80
      - ATTACK_TYPE=sql_injection
      - ATTACK_PHASE=automated
      - WAF_MODE=${WAF_MODE:-disabled}
    volumes:
      - ./confs/attacker/attack.sh:/attack.sh:ro
      - ./confs/attacker/attack_scripts/:/opt/scripts/:ro
      - ./out/${MODE:-mixed}/attacker/:/opt/output/
      - ./out/${MODE:-mixed}/attacker/:/log
    depends_on:
      - nginx
    profiles:
      - attack-only
      - mixed

  user:
    image: python:3.9-alpine
    networks: [edge]
    environment:
      - TARGET_HOST=fancystore.com
      - TARGET_PORT=80
      - WAF_MODE=${WAF_MODE:-disabled}
    volumes:
      - ./confs/user/benign_enhanced.py:/benign_enhanced.py:ro
      - ./out/${MODE:-mixed}/user/:/opt/output/
    depends_on:
      - nginx
    profiles:
      - benign-only
      - mixed

networks:
  edge:
    driver: bridge
    name: ras-vanilla-edge
  appnet:
    driver: bridge
    name: ras-vanilla-appnet
