# -- CRS Setup Configuration ------------------------------------------------
# This file is used to configure the Core Rule Set (CRS) for ModSecurity.
# The CRS is designed to protect web applications from a wide range of
# attacks, including the OWASP Top Ten, with a minimum of false alerts.

# -- Paranoia Level ----------------------------------------------------------
# The Paranoia Level (PL) setting allows you to choose the desired level
# of rule checks. With each paranoia level increase, the CRS enables
# additional rules giving you a higher level of security. However, higher
# paranoia levels also increase the possibility of blocking legitimate
# traffic due to false positives (FPs).
#
# - Paranoia Level 1: Most common attacks
# - Paranoia Level 2: Common attacks + stricter detection
# - Paranoia Level 3: Uncommon attacks + very strict detection  
# - Paranoia Level 4: Very uncommon attacks + extremely strict detection
#
# It is important to also look into the exceptions configured in 
# setup.conf.example. Chances are good that you will need to configure
# exceptions to prevent false positives.
#
# Please set your desired paranoia level here:
SecAction \
  "id:900000,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.paranoia_level=1"

# -- Executing Paranoia Level ------------------------------------------------
# The executing paranoia level determines which rules are executed.
# Generally, this should be the same as tx.paranoia_level but can be
# set to a lower value to test rules at a higher paranoia level without
# actually executing them.
SecAction \
  "id:900001,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.executing_paranoia_level=1"

# -- Detection Paranoia Level ------------------------------------------------
# The detection paranoia level determines which rules will contribute to the
# anomaly score. Generally, this should be the same as tx.paranoia_level.
SecAction \
  "id:900002,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.detection_paranoia_level=1"

# -- Anomaly Mode Configuration ----------------------------------------------
# Anomaly scoring mode is the recommended scoring mode for the CRS.
# In anomaly mode, rules don't immediately block when they match.
# Instead, they increase an anomaly score. At the end of the request,
# the anomaly score is checked and the request is blocked if the
# score is above the threshold.

# -- Inbound Anomaly Score Threshold -----------------------------------------
# If a request scores higher than this threshold, it will be blocked
# with a 403 response.
SecAction \
  "id:900110,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.inbound_anomaly_score_threshold=5"

# -- Outbound Anomaly Score Threshold ----------------------------------------
# If a response scores higher than this threshold, it will be blocked
# with a 403 response.
SecAction \
  "id:900111,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.outbound_anomaly_score_threshold=4"

# -- Early Blocking Configuration --------------------------------------------
# In early blocking mode, the request is blocked as soon as the inbound
# anomaly score threshold is reached, instead of waiting until the end
# of the request phase.
SecAction \
  "id:900120,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.early_blocking=0"

# -- Application Specific Rule Exclusions ------------------------------------
# These exclusions remedy false positives in a default CRS setup without
# locally written rules. The exclusions are application specific. They
# remedy false positives with applications that are often found on
# Apache servers.

# -- Generic Rule Exclusions -------------------------------------------------
# By default, we disable some rules that are prone to false positives.
# You can customize these to fit your application.

# Disable some common false positive prone rules for web applications
SecRuleRemoveById 920350  # Host header is a numeric IP address
SecRuleRemoveById 942100  # Detected SQLi using libinjection
SecRuleRemoveById 942110  # SQL Injection Attack: Common Injection Testing Detected

# -- File Extension Configuration --------------------------------------------
# Configure the file extensions that should be restricted
SecAction \
  "id:900200,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:'tx.restricted_extensions=.asa/ .asax/ .ascx/ .axd/ .backup/ .bak/ .bat/ .cdx/ .cer/ .cfg/ .cmd/ .com/ .config/ .conf/ .cs/ .csproj/ .csr/ .dat/ .db/ .dbf/ .dll/ .dos/ .htr/ .htw/ .ida/ .idc/ .idq/ .inc/ .ini/ .key/ .licx/ .lnk/ .log/ .mdb/ .old/ .pass/ .pdb/ .pol/ .printer/ .pwd/ .resources/ .resx/ .sql/ .sys/ .vb/ .vbs/ .vbproj/ .vsdisco/ .webinfo/ .xsd/ .xsx/'"

# -- Allowed HTTP Versions ---------------------------------------------------
SecAction \
  "id:900230,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:'tx.allowed_http_versions=HTTP/1.0 HTTP/1.1 HTTP/2 HTTP/2.0'"

# -- Allowed Request Content Types -------------------------------------------
SecAction \
  "id:900240,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |multipart/related| |text/xml| |application/xml| |application/soap+xml| |application/x-amf| |application/json| |application/cloudevents+json| |application/cloudevents-batch+json| |text/plain|'"

# -- Enable Sampling ----------------------------------------------------------
# Sampling allows you to run the CRS on only a percentage of requests.
# This can be useful for high-traffic sites where running the full
# CRS on every request might be too resource-intensive.
#
# To enable sampling, uncomment and adjust the following:
# SecAction \
#   "id:900400,\
#    phase:1,\
#    nolog,\
#    pass,\
#    t:none,\
#    setvar:tx.sampling_percentage=100"
