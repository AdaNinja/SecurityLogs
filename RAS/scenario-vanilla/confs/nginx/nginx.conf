events {
    worker_connections 1024;
}

http {
    # include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Custom log format to capture detailed request information
    log_format detailed '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       '"$http_x_forwarded_for" $request_time '
                       '$upstream_response_time "$request_body"';

    # Log all requests to access.log
    access_log /var/log/nginx/access.log detailed;
    error_log /var/log/nginx/error.log;

    # Enable logging of request body (for POST requests)
    client_body_in_file_only on;
    client_body_buffer_size 128k;
    client_max_body_size 100m;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    upstream juiceshop {
        server web:3000;
    }

    server {
        listen 80;
        server_name fancystore.com;

        # Log every request
        location / {
            # Additional logging for debugging
            access_log /var/log/nginx/detailed.log detailed;
            
            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Forward to Juice Shop
            proxy_pass http://juiceshop;
            proxy_redirect off;
            
            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
